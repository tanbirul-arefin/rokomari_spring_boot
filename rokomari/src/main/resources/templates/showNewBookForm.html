<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom: none;
            padding: 30px;
        }

        .card-header h2 {
            color: white;
            font-weight: 700;
            margin: 0;
        }

        .card-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .d-flex {
            gap: 15px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.3);
            background: linear-gradient(135deg, #20c997 0%, #28a745 100%);
        }

        .btn-cancel {
            background-color: #6c757d;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.3);
            text-decoration: none;
        }

        .container-wrapper {
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>

<body>

<div class="container-wrapper">
    <div class="card">
        <div class="card-header">
            <h2>📖 Book Details</h2>
        </div>

        <div class="card-body">
            <form th:action="@{/saveBook}"
                  th:object="${book}"
                  method="post">

                <!-- Hidden field for update -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text"
                           th:field="*{title}"
                           class="form-control"
                           placeholder="Enter book title (e.g., The Great Gatsby)"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Author</label>
                    <input type="text"
                           th:field="*{author}"
                           class="form-control"
                           placeholder="Enter author name (e.g., F. Scott Fitzgerald)"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">ISBN</label>
                    <input type="text"
                           th:field="*{isbn}"
                           class="form-control"
                           placeholder="Enter ISBN number (e.g., 978-0-7432-7356-5)"
                           required>
                </div>

                <div class="d-flex">
                    <button type="submit" class="btn btn-submit">
                        ✅ Save Book
                    </button>

                    <a th:href="@{/}"
                       class="btn btn-cancel">
                        ❌ Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
