<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Book Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div layout:fragment="content">

    <div class="container">

        <h1 class="text-center mt-4 mb-4">Book Manager</h1>

        <a th:href="@{/showNewBookForm}" class="btn btn-primary mb-4">
            Add New Book
        </a>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="book : ${listBooks}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.isbn}"></td>

                <td>
                    <a th:href="@{/showFormForUpdate/{id}(id=${book.id})}" class="btn btn-warning btn-sm">
                        Update
                    </a>

                    <a th:href="@{/deleteBook/{id}(id=${book.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this book?');">
                        Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>


</div>


</body>
</html>
