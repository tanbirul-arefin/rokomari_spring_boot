<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Book Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-top: 20px;
        }

        h1 {
            color: #333;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .btn-add-new {
            background-color: #28a745 !important;
            border: none;
            font-weight: 600;
            padding: 10px 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .btn-add-new:hover {
            background-color: #218838 !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .table {
            margin-top: 20px;
        }

        .table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        .table tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #ddd;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .table td {
            padding: 12px 15px;
            vertical-align: middle;
        }

        .table th {
            padding: 15px;
        }

        .btn-update {
            background-color: #dc3545 !important;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 6px 12px;
            transition: all 0.3s ease;
        }

        .btn-update:hover {
            background-color: #c82333 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
        }

        .btn-delete {
            background-color: #fd7e14 !important;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 6px 12px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background-color: #e56a00 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(253, 126, 20, 0.3);
        }

        .actions-cell {
            min-width: 200px;
        }

        .no-books {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1rem;
        }

        .book-row-new {
            background-color: #d4edda !important;
            animation: slideIn 0.5s ease-out;
        }

        .book-row-updated {
            background-color: #f8d7da !important;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .id-column {
            font-weight: 600;
            color: #667eea;
            width: 60px;
        }

        .title-column {
            font-weight: 500;
            color: #333;
        }

        .author-column {
            color: #555;
        }

        .isbn-column {
            color: #999;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>

<body>

<div class="container">
    <h1 class="text-center">📚 Book Manager</h1>

    <a th:href="@{/showNewBookForm}" class="btn btn-add-new">
        ➕ Add New Book
    </a>

    <div th:if="${listBooks.isEmpty()}" class="no-books">
        <p>No books available. Click "Add New Book" to get started!</p>
    </div>

    <table class="table table-hover" th:unless="${listBooks.isEmpty()}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${listBooks}" class="book-row">
                <td class="id-column" th:text="${book.id}"></td>
                <td class="title-column" th:text="${book.title}"></td>
                <td class="author-column" th:text="${book.author}"></td>
                <td class="isbn-column" th:text="${book.isbn}"></td>
                <td class="actions-cell">
                    <a th:href="@{/showFormForUpdate/{id}(id=${book.id})}" class="btn btn-sm btn-update">
                        ✏️ Update
                    </a>
                    <a th:href="@{/deleteBook/{id}(id=${book.id})}"
                       class="btn btn-sm btn-delete"
                       onclick="return confirm('Are you sure you want to delete this book?');">
                        🗑️ Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
